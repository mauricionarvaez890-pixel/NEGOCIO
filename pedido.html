<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realizar Pedido - CULE PARCHE 🤪</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0b1329; color: #f8fafc; padding: 16px; max-width: 500px; margin: 0 auto; }
    h1 { color: #38bdf8; font-size: 1.5rem; text-align: center; margin-bottom: 15px; }
    
    .panel { background: #131f37; padding: 15px; border-radius: 12px; border: 1px solid #1e293b; margin-bottom: 15px; }
    label { font-size: 0.85rem; color: #94a3b8; font-weight: bold; display: block; margin-top: 10px; margin-bottom: 4px; }
    input, select, textarea { width: 100%; background: #0b1329; border: 1px solid #334155; color: #fff; padding: 10px; border-radius: 8px; font-size: 0.9rem; outline: none; }
    
    .btn-add { background: #38bdf8; color: #0b1329; border: none; padding: 12px; border-radius: 8px; font-weight: 800; width: 100%; cursor: pointer; margin-top: 12px; font-size: 0.95rem; }
    .btn-send { background: #22c55e; color: #0b1329; border: none; padding: 14px; border-radius: 8px; font-weight: 900; width: 100%; cursor: pointer; margin-top: 15px; font-size: 1.1rem; }

    /* Carrito */
    .cart-item { background: #0b1329; border: 1px solid #1e293b; padding: 10px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .cart-item-title { font-weight: bold; color: #4ade80; font-size: 0.9rem; }
    .cart-item-sub { font-size: 0.78rem; color: #cbd5e1; }
    .remove-btn { background: #ef4444; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; font-weight: bold; }
    .total-banner { text-align: right; font-size: 1.2rem; font-weight: 800; color: #38bdf8; margin-top: 10px; }
  </style>
</head>
<body>

  <h1>CULE PARCHE 🤪</h1>

  <!-- Selector de Producto -->
  <div class="panel">
    <h3 style="color:#cbd5e1; font-size:1rem;">🥤 Agregar Granizado</h3>
    
    <label>Sabor:</label>
    <select id="select-sabor">
      <option value="Cerezado">Cerezado</option>
      <option value="Maracuyá">Maracuyá</option>
      <option value="Limón">Limón</option>
      <option value="Mango Biche">Mango Biche</option>
      <option value="Lulo">Lulo</option>
    </select>

    <label>Tamaño / Onzas (ONZ):</label>
    <select id="select-tamano">
      <option value="12 oz" data-precio="6000">12 oz — $6.000</option>
      <option value="16 oz" data-precio="8000">16 oz — $8.000</option>
      <option value="24 oz" data-precio="12000">24 oz — $12.000</option>
    </select>

    <label>Licor:</label>
    <select id="select-licor">
      <option value="SIN LICOR">🥤 SIN LICOR</option>
      <option value="CON LICOR">🍸 CON LICOR (+$2.000)</option>
    </select>

    <label>Cantidad:</label>
    <input type="number" id="input-cantidad" value="1" min="1">

    <button class="btn-add" onclick="addToCart()">+ Agregar al Pedido</button>
  </div>

  <!-- Carrito Dinámico -->
  <div class="panel">
    <h3 style="color:#cbd5e1; font-size:1rem; margin-bottom:10px;">🛒 Tu Pedido</h3>
    <div id="cart-list">
      <p style="color:#64748b; font-size:0.85rem; text-align:center;">No has agregado productos aún.</p>
    </div>
    <div class="total-banner" id="cart-total">Total: $0</div>
  </div>

  <!-- Datos del Cliente -->
  <div class="panel">
    <h3 style="color:#cbd5e1; font-size:1rem;">👤 Datos de Entrega</h3>
    
    <label>Tu Nombre:</label>
    <input type="text" id="cliente-nombre" placeholder="Ej: Juan Pérez">

    <label>Dirección:</label>
    <input type="text" id="cliente-direccion" placeholder="Ej: Cra 5 # 10-20">

    <label>Teléfono / WhatsApp:</label>
    <input type="tel" id="cliente-telefono" placeholder="Ej: 3001234567">

    <label>Notas adicionales (Opcional):</label>
    <textarea id="cliente-notas" rows="2" placeholder="Ej: Sin sorbete, entregar en la puerta."></textarea>

    <button class="btn-send" id="btn-submit" onclick="sendOrder()">🚀 Enviar Pedido</button>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbz0XTSan92ApQ7hjxnJSSPcaXhNdd2290pAYm-JH3KsZRbJ89NAvabCk9i2fuZZTVLD/exec'; // 👈 PEGA AQUÍ TU URL DE APPS SCRIPT
    let cart = [];

    function addToCart() {
      const sabor = document.getElementById('select-sabor').value;
      const tamanoSelect = document.getElementById('select-tamano');
      const tamanoText = tamanoSelect.value;
      let basePrecio = parseInt(tamanoSelect.options[tamanoSelect.selectedIndex].getAttribute('data-precio'), 10);
      
      const licor = document.getElementById('select-licor').value;
      if (licor === 'CON LICOR') basePrecio += 2000;

      const cantidad = parseInt(document.getElementById('input-cantidad').value, 10) || 1;
      const subtotal = basePrecio * cantidad;

      cart.push({ sabor, tamanoText, licor, cantidad, subtotal });
      renderCart();
    }

    function removeItem(index) {
      cart.splice(index, 1);
      renderCart();
    }

    function renderCart() {
      const listContainer = document.getElementById('cart-list');
      if (cart.length === 0) {
        listContainer.innerHTML = '<p style="color:#64748b; font-size:0.85rem; text-align:center;">No has agregado productos aún.</p>';
        document.getElementById('cart-total').innerText = 'Total: $0';
        return;
      }

      let html = '';
      let grandTotal = 0;

      cart.forEach((item, index) => {
        grandTotal += item.subtotal;
        html += `
          <div class="cart-item">
            <div>
              <div class="cart-item-title">${item.cantidad}x Granizado ${item.sabor} (${item.tamanoText})</div>
              <div class="cart-item-sub">${item.licor} — $${item.subtotal.toLocaleString('es-CO')}</div>
            </div>
            <button class="remove-btn" onclick="removeItem(${index})">✕</button>
          </div>
        `;
      });

      listContainer.innerHTML = html;
      document.getElementById('cart-total').innerText = `Total: $${grandTotal.toLocaleString('es-CO')}`;
    }

    async function sendOrder() {
      const nombre = document.getElementById('cliente-nombre').value.trim();
      const direccion = document.getElementById('cliente-direccion').value.trim();
      const telefono = document.getElementById('cliente-telefono').value.trim();
      const notas = document.getElementById('cliente-notas').value.trim();

      if (cart.length === 0) { alert('⚠️ Por favor agrega al menos un producto.'); return; }
      if (!nombre) { alert('⚠️ Ingresa tu nombre.'); return; }

      // Formatear resumen
      let detalleArray = cart.map(i => `${i.cantidad}x Granizado ${i.sabor} (${i.tamanoText}) - ${i.licor}`);
      let pedido_detalle = detalleArray.join('\n');
      let grandTotal = cart.reduce((acc, i) => acc + i.subtotal, 0);

      const btn = document.getElementById('btn-submit');
      btn.innerText = 'Enviando... ⏳';
      btn.disabled = true;

      try {
        await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            cliente: nombre,
            direccion: direccion,
            telefono: telefono,
            pedido_detalle: pedido_detalle,
            total: grandTotal,
            notas: notas
          })
        });

        alert('¡Pedido enviado con éxito! 🍹🎉');
        cart = [];
        renderCart();
        document.getElementById('cliente-nombre').value = '';
        document.getElementById('cliente-direccion').value = '';
        document.getElementById('cliente-telefono').value = '';
        document.getElementById('cliente-notas').value = '';
      } catch (err) {
        alert('Hubo un error enviando el pedido. Intenta de nuevo.');
      } finally {
        btn.innerText = '🚀 Enviar Pedido';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
